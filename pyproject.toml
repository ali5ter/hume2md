[project]
name = "hume2md"
version = "0.1.0"
description = "Convert a Hume Body Pod progress-report PNG into labeled Markdown."
authors = [{ name = "Alister Lewis-Bowen", email = "alister@lewis-bowen.org" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["ocrmac", "rich"]

[project.scripts]
hume2md = "hume2md:main"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
